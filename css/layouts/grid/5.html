<style>
.grid {
  background-color: #ddd;
  padding: 20px;
  width: 800px;
  height: 400px;
   display: grid;
   grid-template-rows: repeat(6, 1fr);
  grid-template-columns: repeat(3, 1fr);
   gap: 20px;
   & div {
      background: #2196f3;
      color: white;
   }
}
.grid > div {
   display: flex;
   justify-content: center;
   align-items: center;
}
.one {
   grid-row-end: -1;
   grid-column: 1 / -1;
}
.two {
   grid-row-start: 2;
   grid-column: 1 / 3;
}
.five {
   grid-area: 3 / 2 / 6 / -1;
}
.eight {
   grid-row-start: 1;
   grid-column: 1 / -1;
}
</style>
<div class="grid">
  <div class="one">1</div>
  <div class="two">2</div>
  <div class="three">3</div>
  <div class="four">4</div>
  <div class="five">5</div>
  <div class="six">6</div>
  <div class="seven">7</div>
  <div class="eight">8</div>
</div>
