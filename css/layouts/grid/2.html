<style>
   body{
      margin: 0;
   }
  .layout {
     display: grid;
     grid-template-columns: repeat(4, 1fr);
     grid-template-rows: 40px 7fr 40px;
     width: 100%;
     height: 100%;
   }
   header{
      grid-column: 1/ -1;
      background: cyan;
      color: white;
         padding: 10px;

    &:before{
        content: 'header';
     }
   }
   section{
      grid-column: 1/ 4;
      background: orange;
      color: white;
         padding: 10px;

      &:before{
     content: 'section';
     }
   }
   aside {
      grid-row: 2;
      grid-column: 4;
      background: gray;
      color: white;
         padding: 10px;

      &:before{
     content: 'aside';
      }
  }
   footer{
      grid-column: 1/ -1;
      background: green;
      color: white;
         padding: 10px;
   &:before{
     content: 'footer';
  }
   }
</style>
<html>
<div class="layout">
  <header></header>
  <section></section>
  <aside></aside>
  <footer></footer>
</div>
</html>
